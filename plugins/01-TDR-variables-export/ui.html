<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111111;
    --muted: #666666;
    --border: #d9d9d9;
    --accent: #111111;
    --accent-fg: #ffffff;
    --error: #b42318;
    --error-bg: #fef3f2;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2c2c2c;
      --fg: #f5f5f5;
      --muted: #a3a3a3;
      --border: #444444;
      --accent: #f5f5f5;
      --accent-fg: #111111;
      --error: #f97066;
      --error-bg: #3b1d1d;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    background: var(--bg);
    color: var(--fg);
    font: 12px/1.4 var(--sans);
  }

  body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 16px 16px;
    min-height: 100%;
  }

  h1 {
    margin: 0;
    flex: 0 0 auto;
    font-size: 14px;
    font-weight: 600;
  }

  .hint {
    margin: 0;
    flex: 0 0 auto;
    color: var(--muted);
  }

  .field-label {
    display: block;
    margin-bottom: 6px;
    color: var(--muted);
  }

  .collections-wrap,
  .prefix-wrap {
    position: relative;
    flex: 0 0 auto;
    z-index: 20;
  }

  .prefix-wrap {
    z-index: 1;
  }

  button,
  input,
  textarea {
    font: inherit;
  }

  input[type='text'] {
    display: block;
    width: 100%;
    height: 32px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }

  input[type='text']::placeholder {
    color: var(--muted);
  }

  .prefix-hint {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 11px;
  }

  .ms {
    position: relative;
  }

  .ms-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    min-height: 32px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    text-align: left;
    cursor: pointer;
  }

  .ms-trigger:disabled {
    opacity: 0.55;
    cursor: default;
  }

  .ms-trigger[aria-expanded='true'] {
    border-color: var(--fg);
  }

  .ms-value {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--fg);
  }

  .ms-value.is-placeholder {
    color: var(--muted);
  }

  .ms-chevron {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 10px;
    line-height: 1;
  }

  .ms-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 180px;
    overflow: auto;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    box-shadow: 0 8px 20px color-mix(in srgb, var(--fg) 12%, transparent);
  }

  .ms-dropdown[hidden] {
    display: none;
  }

  .ms-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
  }

  .ms-option:hover {
    background: color-mix(in srgb, var(--fg) 6%, transparent);
  }

  .ms-option-all {
    margin-bottom: 2px;
    border-bottom: 1px solid var(--border);
    border-radius: 4px 4px 0 0;
    font-weight: 600;
  }

  .ms-option input {
    margin: 0;
    flex: 0 0 auto;
  }

  .ms-option span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ms-empty {
    padding: 8px;
    color: var(--muted);
  }

  .preview-wrap {
    display: flex;
    flex-direction: column;
    flex: 0 0 auto;
    gap: 6px;
  }

  textarea#output {
    display: block;
    width: 100%;
    height: 240px;
    min-height: 120px;
    max-height: 70vh;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    resize: vertical;
    overflow: auto;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.45;
    white-space: pre;
  }

  .actions {
    display: flex;
    flex: 0 0 auto;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  button {
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }

  button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-fg);
  }

  button:disabled {
    opacity: 0.45;
    cursor: default;
  }

  .status {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 16px;
    color: var(--muted);
  }

  .status.error {
    color: var(--error);
  }

  .status.ok {
    color: var(--muted);
  }

  .error-box {
    display: none;
    flex: 0 0 auto;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--error-bg);
    color: var(--error);
  }

  .error-box.visible {
    display: block;
  }
</style>

<h1>Variables → CSS</h1>
<p class="hint">Типы переменных определяются по выбранным коллекциям; локальные Text Styles добавляются автоматически.</p>

<div class="collections-wrap">
  <span class="field-label" id="collections-label">Коллекции</span>
  <div class="ms" id="collections-ms">
    <button
      type="button"
      class="ms-trigger"
      id="collections-trigger"
      aria-labelledby="collections-label"
      aria-haspopup="listbox"
      aria-expanded="false"
      aria-controls="collections-dropdown"
      disabled
    >
      <span class="ms-value is-placeholder" id="collections-value">Загрузка…</span>
      <span class="ms-chevron" aria-hidden="true">▾</span>
    </button>
    <div
      class="ms-dropdown"
      id="collections-dropdown"
      role="listbox"
      aria-multiselectable="true"
      aria-labelledby="collections-label"
      hidden
    ></div>
  </div>
</div>

<div class="prefix-wrap">
  <label class="field-label" for="prefix">Префикс</label>
  <input
    id="prefix"
    type="text"
    value="tdr"
    placeholder="tdr"
    autocomplete="off"
    spellcheck="false"
  />
  <p class="prefix-hint">Пример: --tdr-bg-primary, .tdr-text-body-m</p>
</div>

<div id="error" class="error-box" role="alert"></div>

<div class="preview-wrap">
  <label class="field-label" for="output">Вывод</label>
  <textarea
    id="output"
    readonly
    placeholder="Выберите коллекции и нажмите «Экспортировать»"
  ></textarea>
</div>

<div class="actions">
  <button id="export" class="primary" type="button" disabled>Экспортировать</button>
  <button id="copy" type="button" disabled>Скопировать</button>
  <button id="close" type="button">Закрыть</button>
  <span id="status" class="status" aria-live="polite"></span>
</div>

<script>
  const triggerEl = document.getElementById('collections-trigger');
  const valueEl = document.getElementById('collections-value');
  const dropdownEl = document.getElementById('collections-dropdown');
  const prefixInput = document.getElementById('prefix');
  const outputArea = document.getElementById('output');
  const exportButton = document.getElementById('export');
  const copyButton = document.getElementById('copy');
  const closeButton = document.getElementById('close');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');

  let collectionsData = [];
  let dropdownOpen = false;

  function getPrefix() {
    return (prefixInput.value || '').trim();
  }

  function setError(message) {
    if (!message) {
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
      return;
    }
    errorEl.textContent = message;
    errorEl.classList.add('visible');
  }

  function setStatus(message, kind) {
    statusEl.textContent = message || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function setOutput(css) {
    outputArea.value = css || '';
    copyButton.disabled = !css;
  }

  function post(message) {
    parent.postMessage({ pluginMessage: message }, '*');
  }

  function getCollectionCheckboxes() {
    return Array.from(
      dropdownEl.querySelectorAll('input[type="checkbox"][data-collection="true"]')
    );
  }

  function getSelectAllCheckbox() {
    return dropdownEl.querySelector('#collections-select-all');
  }

  function getSelectedCollectionIds() {
    return getCollectionCheckboxes()
      .filter((input) => input.checked)
      .map((input) => input.value);
  }

  function getSelectedCollectionNames() {
    return getCollectionCheckboxes()
      .filter((input) => input.checked)
      .map((input) => {
        const label = input.closest('label');
        const span = label && label.querySelector('span');
        return span ? span.textContent : input.value;
      });
  }

  function syncSelectAllState() {
    const selectAll = getSelectAllCheckbox();
    if (!selectAll) {
      return;
    }
    const boxes = getCollectionCheckboxes();
    const checkedCount = boxes.filter((input) => input.checked).length;
    selectAll.checked = boxes.length > 0 && checkedCount === boxes.length;
    selectAll.indeterminate = checkedCount > 0 && checkedCount < boxes.length;
  }

  function updateTriggerLabel() {
    const names = getSelectedCollectionNames();
    if (names.length === 0) {
      valueEl.textContent =
        collectionsData.length === 0 ? 'Нет коллекций' : 'Выберите коллекции';
      valueEl.classList.add('is-placeholder');
      syncSelectAllState();
      return;
    }
    valueEl.textContent =
      names.length <= 2 ? names.join(', ') : names[0] + ' +' + (names.length - 1);
    valueEl.classList.remove('is-placeholder');
    syncSelectAllState();
  }

  function updateExportEnabled() {
    exportButton.disabled =
      triggerEl.disabled || getSelectedCollectionIds().length === 0;
  }

  function onCollectionSelectionChange() {
    setStatus('');
    updateTriggerLabel();
    updateExportEnabled();
  }

  function setDropdownOpen(open) {
    if (triggerEl.disabled) {
      open = false;
    }
    dropdownOpen = open;
    triggerEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    dropdownEl.hidden = !open;
  }

  function copyViaExecCommand(text) {
    const helper = document.createElement('textarea');
    helper.value = text;
    helper.setAttribute('readonly', '');
    helper.style.position = 'fixed';
    helper.style.top = '0';
    helper.style.left = '0';
    helper.style.width = '1px';
    helper.style.height = '1px';
    helper.style.padding = '0';
    helper.style.border = 'none';
    helper.style.outline = 'none';
    helper.style.boxShadow = 'none';
    helper.style.background = 'transparent';
    helper.style.opacity = '0';
    document.body.appendChild(helper);
    helper.focus();
    helper.select();
    helper.setSelectionRange(0, text.length);
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (_err) {
      ok = false;
    }
    document.body.removeChild(helper);
    return ok;
  }

  async function copyText(text) {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_err) {
        // Figma plugin iframe often blocks Clipboard API — fall through.
      }
    }
    return copyViaExecCommand(text);
  }

  function renderCollections(collections) {
    collectionsData = collections.slice();
    dropdownEl.innerHTML = '';
    setDropdownOpen(false);

    if (collections.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'ms-empty';
      empty.textContent = 'Нет локальных коллекций';
      dropdownEl.appendChild(empty);
      triggerEl.disabled = true;
      valueEl.textContent = 'Нет коллекций';
      valueEl.classList.add('is-placeholder');
      setOutput('');
      setError('В файле нет локальных Variable Collections.');
      updateExportEnabled();
      return;
    }

    triggerEl.disabled = false;
    setError('');

    const selectAllLabel = document.createElement('label');
    selectAllLabel.className = 'ms-option ms-option-all';

    const selectAllInput = document.createElement('input');
    selectAllInput.type = 'checkbox';
    selectAllInput.id = 'collections-select-all';
    selectAllInput.addEventListener('change', () => {
      const checked = selectAllInput.checked;
      for (const input of getCollectionCheckboxes()) {
        input.checked = checked;
      }
      selectAllInput.indeterminate = false;
      onCollectionSelectionChange();
    });

    const selectAllName = document.createElement('span');
    selectAllName.textContent = 'Выбрать все';

    selectAllLabel.appendChild(selectAllInput);
    selectAllLabel.appendChild(selectAllName);
    dropdownEl.appendChild(selectAllLabel);

    for (const collection of collections) {
      const label = document.createElement('label');
      label.className = 'ms-option';
      label.setAttribute('role', 'option');

      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = collection.id;
      input.dataset.collection = 'true';
      input.addEventListener('change', onCollectionSelectionChange);

      const name = document.createElement('span');
      name.textContent = collection.name;
      name.title = collection.name;

      label.appendChild(input);
      label.appendChild(name);
      dropdownEl.appendChild(label);
    }

    updateTriggerLabel();
    updateExportEnabled();
  }

  triggerEl.addEventListener('click', (event) => {
    event.stopPropagation();
    if (triggerEl.disabled) {
      return;
    }
    setDropdownOpen(!dropdownOpen);
  });

  dropdownEl.addEventListener('click', (event) => {
    event.stopPropagation();
  });

  document.addEventListener('click', () => {
    if (dropdownOpen) {
      setDropdownOpen(false);
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && dropdownOpen) {
      setDropdownOpen(false);
      triggerEl.focus();
    }
  });

  exportButton.onclick = () => {
    const collectionIds = getSelectedCollectionIds();
    if (collectionIds.length === 0) {
      return;
    }

    setDropdownOpen(false);
    setError('');
    setStatus('Экспорт…');
    post({
      type: 'export-collections',
      collectionIds,
      prefix: getPrefix(),
    });
  };

  copyButton.onclick = async () => {
    const text = outputArea.value;
    if (!text) {
      return;
    }
    const ok = await copyText(text);
    if (ok) {
      setStatus('Скопировано', 'ok');
      return;
    }
    outputArea.focus();
    outputArea.select();
    setStatus('Выделите текст и скопируйте вручную (⌘C)', 'error');
  };

  closeButton.onclick = () => {
    post({ type: 'close' });
  };

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) {
      return;
    }

    if (msg.type === 'collections') {
      if (typeof msg.prefix === 'string') {
        prefixInput.value = msg.prefix;
      }
      renderCollections(msg.collections || []);
      return;
    }

    if (msg.type === 'export-result') {
      setError('');
      setOutput(msg.css);
      setStatus('Готово', 'ok');
      return;
    }

    if (msg.type === 'export-error') {
      setOutput('');
      setError(msg.message || 'Ошибка экспорта');
      setStatus('', 'error');
    }
  };

  updateExportEnabled();
  post({ type: 'ready' });
</script>
